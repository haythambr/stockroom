name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stockroom_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stockroom_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stockroom_test?schema=public
      JWT_SECRET: ci-secret-that-is-at-least-32-characters-long
      PAYMENT_WEBHOOK_SECRET: whsec_ci_secret_123
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Proves the README's "docker compose up" really works: builds every image, starts the
  # whole stack, and checks it from the outside like a visitor would.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and start database, API and website
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: API is up and can reach the database
        run: curl -fsS http://localhost:3000/health | tee /dev/stderr | grep -q '"database":"up"'
      - name: Website is served
        run: curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
      - name: Website deep links fall back to the app
        run: curl -fsS http://localhost:8080/products/kit-mug-01 | grep -q '<div id="root">'
      - name: Website reaches the API through /api, with demo data loaded
        run: curl -fsS "http://localhost:8080/api/products?limit=1" | tee /dev/stderr | grep -q '"total":24'
      - name: Demo customer can sign in through the website
        run: |
          curl -fsS -X POST http://localhost:8080/api/auth/login             -H 'Content-Type: application/json'             -d '{"email":"customer@stockroom.test","password":"password123"}' | grep -q accessToken
      - name: Logs if anything failed
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down --volumes
