# One-command demo:  docker compose up --build
#   Shop website:  http://localhost:8080
#   API:           http://localhost:3000
#   API docs:      http://localhost:3000/docs

services:
  api:
    build: .
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://stockroom:stockroom@db:5432/stockroom?schema=public
      JWT_SECRET: docker-demo-secret-change-me-0123456789abcdef
      PAYMENT_WEBHOOK_SECRET: whsec_docker_demo_secret
      SEED_DEMO_DATA: "true"
      DEMO_PAYMENTS: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Healthy once migrations ran and the API can reach the database.
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 5s
      start_period: 20s
      retries: 20

  web:
    build: ./web
    ports: ["8080:80"]
    depends_on:
      api:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stockroom
      POSTGRES_PASSWORD: stockroom
      POSTGRES_DB: stockroom
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockroom"]
      interval: 3s
      retries: 20

volumes:
  db-data:
